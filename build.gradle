plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files("lib/json-20231013.jar")
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'gui.GpsAppGui'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing' ]
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required  = true
    }
}

task runCli(type: JavaExec) {
    group = 'application'
    description = 'Run the GPS App in CLI mode'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('core.MainCLI')
    standardInput = System.in
}

tasks.register('generatePackagingConfig', WriteProperties) {
    group = 'distribution'
    description = 'Writes a config.properties containing the deployment Mapbox token, for jpackage staging only.'
    destinationFile = layout.buildDirectory.file('jpackage/config/config.properties')
    outputs.upToDateWhen { false }
    doFirst {
        def token = System.getenv('GPS_APP_MAPBOX_DEPLOY_TOKEN')
        if (token == null || token.trim().isEmpty()) {
            throw new GradleException(
                "GPS_APP_MAPBOX_DEPLOY_TOKEN is missing or blank. " +
                "Set it to a valid public Mapbox deployment token before running jpackageJar/jpackageInput."
            )
        }
        property('mapbox.token', token)
    }
}

tasks.register('jpackageJar', Jar) {
    group = 'distribution'
    description = 'Builds the application jar for jpackage staging, using the generated deployment config.properties.'
    archiveBaseName = 'gps-distance-app'
    archiveVersion = ''
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('jpackage/libs')
    dependsOn generatePackagingConfig
    from(sourceSets.main.output) {
        exclude 'config.properties'
    }
    from(generatePackagingConfig.destinationFile)
    manifest {
        attributes 'Main-Class': 'gui.GpsAppGui'
    }
}

tasks.register('jpackageInput', Sync) {
    group = 'distribution'
    description = 'Stages the application jar and all runtime dependencies into build/jpackage/input for jpackage.'
    dependsOn jpackageJar
    from(jpackageJar.archiveFile)
    from(configurations.runtimeClasspath)
    into layout.buildDirectory.dir('jpackage/input')
}

ext {
    jpackageAppName = 'GPS Distance Calculator'
    jpackageAppVersion = '1.0.0'
    jpackageVendor = 'Nina Mason'
}

tasks.register('jpackageAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Windows app-image via jpackage (no installer yet).'
    dependsOn jpackageInput
    inputs.dir(layout.buildDirectory.dir('jpackage/input'))
    inputs.file('packaging/compass.ico')
    def outputDir = layout.buildDirectory.dir('jpackage/app-image')
    outputs.dir(outputDir)
    doFirst {
        delete outputDir
    }
    commandLine 'jpackage',
        '--type', 'app-image',
        '--input', layout.buildDirectory.dir('jpackage/input').get().asFile,
        '--dest', outputDir.get().asFile,
        '--name', jpackageAppName,
        '--main-jar', 'gps-distance-app.jar',
        '--main-class', 'gui.GpsAppGui',
        '--icon', file('packaging/compass.ico'),
        '--app-version', jpackageAppVersion,
        '--vendor', jpackageVendor,
        '--java-options', '--module-path=$APPDIR',
        '--java-options', '--add-modules=javafx.controls,javafx.fxml,javafx.web,javafx.swing'
}

tasks.register('jpackageInstaller', Exec) {
    group = 'distribution'
    description = 'Builds a Windows EXE installer via jpackage. Requires the WiX Toolset (candle.exe/light.exe) on PATH.'
    dependsOn jpackageAppImage
    def appImageDir = layout.buildDirectory.dir("jpackage/app-image/${jpackageAppName}")
    inputs.dir(appImageDir)
    def outputDir = layout.buildDirectory.dir('jpackage/installer')
    outputs.dir(outputDir)
    doFirst {
        delete outputDir
    }
    commandLine 'jpackage',
        '--type', 'exe',
        '--app-image', appImageDir.get().asFile,
        '--dest', outputDir.get().asFile,
        '--name', jpackageAppName,
        '--app-version', jpackageAppVersion,
        '--vendor', jpackageVendor,
        '--win-menu',
        '--win-shortcut'
}
